name: Update Roblox stats

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data:data
            git worktree add stats-data data
          else
            git worktree add --orphan -b data stats-data
          fi

      - name: Fetch stats
        run: npx tsx scripts/fetch-stats.ts stats-data/stats.json

      - name: Publish stats
        working-directory: stats-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats.json
          if git rev-parse --verify HEAD > /dev/null 2>&1; then
            git commit --amend -m 'Update stats' --quiet
          else
            git commit -m 'Update stats' --quiet
          fi
          git push --force origin data
